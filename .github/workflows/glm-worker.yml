# GLM 作業係
#
# GitHub Actions の使い捨ての機械で、GLM（Z.ai のモデル）を頭にした Claude Code を動かす。
# Hugging Face の窓口（Inference Providers）を通して呼ぶので、料金は Hugging Face 側にかかる。
# 指示は Actions の手動実行で渡し、結果は glm/run-<番号> の枝（ブランチ）に置く。
# main には書き込まない。サイトは main への push で公開されるので、取り込むかどうかは人が決める。
#
# GLM は確認なしで何でも実行できる（コマンド、ネットからの取得、sudo も含む）。
# そのため仕事を2つに分けている。
#   work    … GLM が作業する。GitHub の鍵は読むだけの権限にして、書き込めないようにする。
#   publish … 別の機械で、work が作った変更を受け取って枝に置く。ここでは GLM は動かない。
# .github/ の変更は捨てる。GLM が自分の動かし方を書き換えないようにするため。
# GLM からは HF_TOKEN が見える。推論の呼び出しだけを許可した鍵にして、漏れても被害が料金で済むようにする。
#
# 使う前に一度だけ:
#   1. Settings → Secrets and variables → Actions に HF_TOKEN を登録する。
#      Hugging Face の鍵で、「Make calls to Inference Providers」だけを許可したもの。
#   2. このファイルを main に入れる。手動実行の入口は main にあるファイルからしか作られない。
#
# このリポジトリは公開されているので、実行記録（指示と GLM の報告）は誰でも読める。
# 顧客名・個人情報・合言葉を含む指示は出さない。

name: GLM 作業係

on:
  workflow_dispatch:
    inputs:
      instruction:
        description: GLM への指示
        required: true
        type: string
      base:
        description: 作業の元にする枝（前回の続きなら glm/run-<番号>）
        required: false
        default: main
        type: string
      model:
        description: モデル。末尾の :zai-org は提供元の固定で、外すと速い提供元へ自動で振り分ける
        required: false
        default: zai-org/GLM-5.3:zai-org
        type: string
      max_turns:
        description: やり取りの回数の上限（料金の歯止め）
        required: false
        default: "60"
        type: string

permissions:
  contents: read

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.glm.outputs.base_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.base }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Claude Code を入れる
        run: npm install -g @anthropic-ai/claude-code

      - name: GLM に作業させる
        id: glm
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          MODEL: ${{ inputs.model }}
          INSTRUCTION: ${{ inputs.instruction }}
          MAX_TURNS: ${{ inputs.max_turns }}
          RULES: |
            あなたは GitHub Actions の使い捨ての機械で動いている。コマンドの実行もネットからの取得も、確認なしでできる。
            - 指示された作業だけを行い、関係のないファイルは変えない。
            - push はできない。変更は後の手順が枝に置く。.github/ の変更は採用されない。
            - 最後に、変えたファイルとその理由を日本語で短く報告する。確かめられなかった点はそう書く。
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN が登録されていない。Settings → Secrets and variables → Actions で登録する。" >&2
            exit 1
          fi
          BASE_SHA="$(git rev-parse HEAD)"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          OUT="$RUNNER_TEMP/glm"
          mkdir -p "$OUT"

          # 文脈の長さは提供元の公開値に合わせる。
          # 渡さないと Claude Code は知らないモデルを20万トークン扱いにして、早めに要約を始める。
          BASE_MODEL="${MODEL%%:*}"
          PROVIDER=""
          case "$MODEL" in *:*) PROVIDER="${MODEL#*:}" ;; esac
          case "$PROVIDER" in fastest|cheapest|preferred) PROVIDER="" ;; esac
          CONTEXT="$(curl -fsS https://router.huggingface.co/v1/models \
              -H "Authorization: Bearer $HF_TOKEN" \
            | jq -r --arg m "$BASE_MODEL" --arg p "$PROVIDER" \
              '[.data[] | select(.id == $m) | .providers[]
                | select($p == "" or .provider == $p) | .context_length // empty] | min // empty' \
            || true)"

          export ANTHROPIC_BASE_URL="https://router.huggingface.co"
          export ANTHROPIC_AUTH_TOKEN="$HF_TOKEN"
          export ANTHROPIC_API_KEY="$HF_TOKEN"
          export ANTHROPIC_DEFAULT_OPUS_MODEL="$MODEL"
          export ANTHROPIC_DEFAULT_SONNET_MODEL="$MODEL"
          export ANTHROPIC_DEFAULT_HAIKU_MODEL="$MODEL"
          export ANTHROPIC_DEFAULT_FABLE_MODEL="$MODEL"
          export CLAUDE_CODE_SUBAGENT_MODEL="$MODEL"
          # Anthropic への利用状況の報告と自動更新を止める。話す相手は Hugging Face だけ。
          export CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1
          if [[ "$CONTEXT" =~ ^[0-9]+$ ]] && [ "$CONTEXT" -gt 0 ]; then
            export CLAUDE_CODE_MAX_CONTEXT_TOKENS="$CONTEXT"
            echo "文脈の長さ: $CONTEXT"
          fi

          # 確認なしで動かす。途中で止まっても、そこまでの変更は publish が枝に残す。
          status=0
          claude -p "$INSTRUCTION" \
            --model "$MODEL" \
            --max-turns "$MAX_TURNS" \
            --dangerously-skip-permissions \
            --append-system-prompt "$RULES" \
            > "$OUT/report.md" || status=$?
          echo "$status" > "$OUT/status"

          # GLM が commit していても、元の commit からの差分としてまとめて渡す。
          git add -A
          git diff --cached --binary "$BASE_SHA" -- . ':(exclude).github' > "$OUT/changes.patch"
          git diff --cached --name-only "$BASE_SHA" -- .github > "$OUT/dropped.txt"

      - uses: actions/upload-artifact@v6
        with:
          name: glm-result
          path: ${{ runner.temp }}/glm
          retention-days: 7

  publish:
    needs: work
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.work.outputs.base_sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v6
        with:
          name: glm-result
          path: ${{ runner.temp }}/glm

      - name: 結果を枝に置く
        env:
          GH_TOKEN: ${{ github.token }}
          INSTRUCTION: ${{ inputs.instruction }}
          BASE: ${{ inputs.base }}
          MODEL: ${{ inputs.model }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export LC_ALL=C.UTF-8
          DIR="$RUNNER_TEMP/glm"
          REPORT="$(cat "$DIR/report.md" 2>/dev/null || true)"
          STATUS="$(cat "$DIR/status" 2>/dev/null || echo "?")"
          DROPPED="$(tr '\n' ' ' < "$DIR/dropped.txt" 2>/dev/null || true)"
          NOTES=""
          if [ "$STATUS" != "0" ]; then
            NOTES+="GLM の実行は途中で止まった（終了コード $STATUS）。"$'\n'
          fi
          if [ -n "${DROPPED// /}" ]; then
            NOTES+=".github/ の変更は捨てた: $DROPPED"$'\n'
          fi

          {
            echo "## 指示"; echo; echo "$INSTRUCTION"; echo
            echo "## GLM の報告"; echo; echo "$REPORT"; echo
            if [ -n "$NOTES" ]; then echo "$NOTES"; fi
          } >> "$GITHUB_STEP_SUMMARY"

          # .github/ は work 側でも外しているが、ここでも念のため捨てる。
          if [ -s "$DIR/changes.patch" ]; then
            git apply --index --exclude='.github/*' "$DIR/changes.patch"
          fi
          if git diff --cached --quiet; then
            echo "ファイルの変更なし。枝は作らない。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "glm-worker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FIRST_LINE="${INSTRUCTION%%$'\n'*}"
          {
            echo "GLM作業（${GITHUB_RUN_NUMBER}）: ${FIRST_LINE:0:40}"
            echo
            echo "■ 指示"
            echo "$INSTRUCTION"
            echo
            echo "■ GLM の報告"
            echo "${REPORT:0:8000}"
            echo
            echo "■ 実行"
            echo "モデル: $MODEL / 元の枝: $BASE"
            if [ -n "$NOTES" ]; then printf '%s' "$NOTES"; fi
            echo "$RUN_URL"
          } > "$RUNNER_TEMP/message.txt"
          git commit -q -F "$RUNNER_TEMP/message.txt"

          BRANCH="glm/run-${GITHUB_RUN_NUMBER}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          echo "結果の枝: \`${BRANCH}\`" >> "$GITHUB_STEP_SUMMARY"
